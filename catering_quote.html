  var HELP = [
    ["The basic idea", ["Custom Event builds the price from what the event costs us. You enter the real costs (food, staff, equipment); the calculator adds a small safety buffer and our margin, then VAT. Drinks, the hall and hired-out staff have their own fixed prices and are added on top.", "Everything you change updates the summary on the right straight away."]],
    ["Staff lines — what one line costs", ["Cost = staff \xD7 hours \xD7 base kr/hr \xD7 rate \xD7 salary-related costs.", "Base kr/hr is the daytime wage for that role (general staff 3,000; head chef 3,500 — set in ⚙️ Roles). Rate is the shift supplement: daytime \xD71.0, evening \xD71.33, weekend \xD71.45, holiday \xD71.9. “Auto” reads the event date and start time. Salary-related costs (\xD71.33) cover pension, holiday pay and payroll taxes.", "Example: 1 waiter \xD7 8h \xD7 3,000 \xD7 1.45 (weekend) \xD7 1.33 = 46,284 kr. This is our true cost, with no profit in it. Hover the cost on any line to see its own sum.", "Use the note on each line to record why it's there (“pin assembly, 1 per 45 guests”), so the quote still makes sense when you come back to it."]],
    ["Hire out (staff sold separately)", ["Tick “Hire out” for staff the client pays for as a separate line, e.g. a house manager on a food-only event. The line is then not part of the menu price: the client pays cost \xD7 1.33, or the hire price you type, plus 24% VAT."]],
    ["From cost to price — contingency, overhead and margin", ["Catering cost = ingredients + own staff + planning hours + equipment + consumables (+ transport when bundled).", "Contingency (5–7%) is added on top as a buffer for the things that always go a bit wrong. It counts as a cost, so the margin is worked out on top of it — yes, it makes everything a little dearer.", "Price = (cost + contingency) \xF7 (1 − margin % − overhead %). With 25% margin and 10% overhead that is \xF7 0.65. Margin is a share of the price, not a mark-up on cost: a 25% margin is a 33% mark-up.", "Overhead % is our share of rent, electricity, subscriptions, insurance and accounting."]],
    ["Menu builder (food cost)", ["Build the food cost per guest from components: price per kg / litre / piece, average portion per guest and yield after trimming and cooking loss. Two proteins on a buffet? Split the total, e.g. 140 g lamb + 60 g turkey = 200 g meat.", "House rule for buffets: a guest eats about 500 g, so plan about 600 g in total (all courses, sides and sauces). The builder shows the planned grams against that target. Over-production % is then added on top so the buffet does not run out \u2014 it raises both the cost and the buy quantities."]],
    ["Drinks package", ["Option A: pre-paid units at a fixed price (1,250 kr incl. VAT), not refundable once the final number is confirmed. Option B: a higher price per unit drunk, with a minimum share of the ordered units charged.", "Drink prices are fixed, not marked up. Our cost is the units we expect to be drunk \xD7 the average cost from the beer / cider / wine mix; unused units go back into stock. Soft drinks are billed separately per unit."]],
    ["Ingólfshvoll hall", ["Hall rent is 170,000 kr ex. VAT. With food and a drinks package of at least the minimum units per guest, 9% of food & drink spend (incl. VAT) comes off the rent, down to 0 kr. VAT on the hall is added to what is left.", "“Fold the hall into the menu price” hides the hall line and adds the remaining rent to the menu price (billed at the food VAT rate).", "The landlord takes 12.5% of all event revenue ex. VAT. The calculator counts it as a cost."]],
    ["What the margin means on a full event", ["With drinks, hall or hire on the quote, the calculator finds the food price that gives the target margin across the whole event, after landlord and overhead. Food is never priced below its own cost. “Event profit after landlord & overhead” is the real bottom line; “Menu price per guest” is the number to quote a party planner."]],
    ["Price ladder", ["Only shown for Ingólfshvoll quotes, folded away by default. It guesses the food price per guest the same setup would need at 50 to 1,000 guests, scaling prep and service staff (a little less than in proportion, in whole people). The staffing at each size is an estimate, so use it to sanity-check a price list for a repeat format, not to quote a one-off event."]],
    ["VAT", ["Food and drinks 11%. Transport as a separate line, staff hire and the hall 24% (or none / folded — to be confirmed with the accountant)."]],
    ["Quotes, templates, roles and policies", ["\u{1F4BE} Save stores the whole quote (staff lines, drinks, hall) in History and in the Catering Quotes Log Sheet. Templates store a setup to reuse. Roles live in the Roles tab and booking policies in the Policies tab of the same Sheet — tick which policies go on each quote.", "Client PDF shows prices only: the cost lines are scaled up to the selling price, so no costs or margins are shown. Review PDF is internal: costs, landlord, margin and profit."]]
    ["Private chef \u2014 how days are counted", ["We count the Nordic Luxury way. A service day is one breakfast and one dinner. An arrival dinner and a departure breakfast together make one day, so a 3-day villa stay (dinner, full day, breakfast) is 2 service days. The tab takes the larger of the two counts: 2 breakfasts and 3 dinners is 3 days. There are no partial days.", "With no breakfast at all, each dinner is a one-off dinner (95,000 kr + 7,000 kr per guest), which carries the drive in its fee."]],
    ["Private chef \u2014 the price", ["Service day: 110,000 kr chef fee + 11,000 kr per guest for guests 1\u20135 + 9,000 kr per guest above 5. For 8 guests: 110,000 + 55,000 + 27,000 = 192,000 kr. The per-guest part pays for the food.", "Holidays: only the major holidays (st\xF3rh\xE1t\xED\xF0ardagar \u2014 New Year's Day, Good Friday, Easter Sunday, Whit Sunday, 17 June, Christmas Day, and Christmas Eve and New Year's Eve from 12:00) are \xD71.9 on the chef fee, extra staff and the on-site lunch fee. Other public holidays (Maundy Thursday, Easter Monday, First Day of Summer, 1 May, Ascension Day, Whit Monday, Commerce Day, 26 December) are normal price.", "Lunch is extra: boxes 3,800 kr per guest; lunch on site 60,000 kr + ingredients at cost + 30%.", "Each day has its own extra staff (waiter or bartender: 58,800 kr a meal, 98,000 kr a full day), purchases at cost + 30% (wine, drinks, private shopping), fixed-price extras (welcome cocktails 800 kr, host dinners 2,900 kr) and a note that prints on the quote.", "All prices include 11% VAT; the invoice is one \u201CPrivate chef\u201D line. The panel shows what the booking earns with a contractor chef (65,000 kr a day) and with an employed chef (hours \xD7 3,500 \xD7 1.33, \xD71.45 weekends and holidays). \u{1F9EE} How it's worked out in the panel shows every step with this quote's numbers."]],
    ["Private chef \u2014 menus", ["Pick a dinner menu per day (Ing\xF3lfsfjall, \xD6lfus\xE1, Lax\xE1, Haginn, Vegetarian, Farewell feast, Celebration tasting) or build a custom one from \u{1F4A1} Menu ideas. Breakfast shows the standard buffet; Choose items to drop or add things. Every dish and breakfast item can carry a food cost per guest (+ cost, or \u{1F9EE} to cost it from the price book); it is saved in the Recipes tab of the Quotes Log Sheet and every quote uses it. Dishes without a cost use the default breakfast and dinner cost.", "Food is meant to be charged close to cost: the per-guest part of the fee covers it. Drinks and purchases are their price incl. VAT + 30%."]],
    ["\u{1F4A1} Suggestion box", ["Every tab has a \u{1F4A1} Suggest button: report a bug, a missing menu or dish, or an idea. It goes to the Suggestions tab in the Catering Quotes Log Sheet, where \xC1rni sets the status and can reply; replies show in the box."]],
