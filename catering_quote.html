  function startMO(){ mo.observe(document.body,{subtree:true,childList:true,attributes:true,attributeFilter:['data-bar']}); mo.observe(root,{attributes:true,attributeFilter:['class']}); sendBar(true); }
  startMO();
  /* fallback (older website code): work out the visible part ourselves */
  if(!('IntersectionObserver' in window)) return;
  var box=document.createElement('div'); box.setAttribute('aria-hidden','true');
  box.style.cssText='position:fixed;left:0;top:0;bottom:0;width:1px;overflow:hidden;pointer-events:none;visibility:hidden';
  document.body.appendChild(box);
  var S=80, seen={}, lastH=0, th=[]; for(var k=0;k<=16;k++)th.push(k/16);
  function apply(){
    if(host) return;
    var b=-1,t=1e9; for(var id in seen){ if(seen[id][1]>b) b=seen[id][1]; if(seen[id][0]<t) t=seen[id][0]; }
    setVis(t,b);
  }
  function build(){
    if(host) return;
    var h=window.innerHeight; if(io&&Math.abs(h-lastH)<S)return; lastH=h;
    if(io)io.disconnect(); box.innerHTML=''; seen={};
    io=new IntersectionObserver(function(es){
      es.forEach(function(e){ var id=e.target.dataset.i;
        if(e.isIntersecting&&e.intersectionRect.height>0) seen[id]=[e.intersectionRect.top,e.intersectionRect.bottom]; else delete seen[id]; });
      apply();
    },{threshold:th});
    for(var i=0;i*S<h;i++){ var d=document.createElement('div'); d.dataset.i=i;
      d.style.cssText='position:absolute;left:0;width:1px;top:'+(i*S)+'px;height:'+S+'px'; box.appendChild(d); io.observe(d); }
  }
  build(); window.addEventListener('resize',build);
})();
</script>
