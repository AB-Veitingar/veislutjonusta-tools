  var HELP = [
    ["The basic idea", ["Custom Event builds the price from what the event costs us. You enter the real costs (food, staff, equipment); the calculator adds a small safety buffer and our margin, then VAT. Drinks, the hall and hired-out staff have their own fixed prices and are added on top.", "Everything you change updates the summary on the right straight away."]],
    ["Staff lines — what one line costs", ["Cost = staff \xD7 hours \xD7 base kr/hr \xD7 rate \xD7 salary-related costs.", "Base kr/hr is the daytime wage for that role (general staff 3,000; head chef 3,500 — set in ⚙️ Roles). Rate is the shift supplement: daytime \xD71.0, evening \xD71.33, weekend \xD71.45, holiday \xD71.9. “Auto” reads the event date and start time. Salary-related costs (\xD71.33) cover pension, holiday pay and payroll taxes.", "Example: 1 waiter \xD7 8h \xD7 3,000 \xD7 1.45 (weekend) \xD7 1.33 = 46,284 kr. This is our true cost, with no profit in it. Hover the cost on any line to see its own sum.", "Use the note on each line to record why it's there (“pin assembly, 1 per 45 guests”), so the quote still makes sense when you come back to it."]],
    ["Hire out (staff sold separately)", ["Tick “Hire out” for staff the client pays for as a separate line, e.g. a house manager on a food-only event. The line is then not part of the menu price: the client pays cost \xD7 1.33, or the hire price you type, plus 24% VAT."]],
    ["From cost to price — contingency, overhead and margin", ["Catering cost = ingredients + own staff + planning hours + equipment + consumables (+ transport when bundled).", "Contingency (5–7%) is added on top as a buffer for the things that always go a bit wrong. It counts as a cost, so the margin is worked out on top of it — yes, it makes everything a little dearer.", "Price = (cost + contingency) \xF7 (1 − margin % − overhead %). With 25% margin and 10% overhead that is \xF7 0.65. Margin is a share of the price, not a mark-up on cost: a 25% margin is a 33% mark-up.", "Overhead % is our share of rent, electricity, subscriptions, insurance and accounting."]],
    ["Drinks package", ["Option A: pre-paid units at a fixed price (1,250 kr incl. VAT), not refundable once the final number is confirmed. Option B: a higher price per unit drunk, with a minimum share of the ordered units charged.", "Drink prices are fixed, not marked up. Our cost is the units we expect to be drunk \xD7 the average cost from the beer / cider / wine mix; unused units go back into stock. Soft drinks are billed separately per unit."]],
    ["Ingólfshvoll hall", ["Hall rent is 170,000 kr ex. VAT. With food and a drinks package of at least the minimum units per guest, 9% of food & drink spend (incl. VAT) comes off the rent, down to 0 kr. VAT on the hall is added to what is left.", "“Fold the hall into the menu price” hides the hall line and adds the remaining rent to the menu price (billed at the food VAT rate).", "The landlord takes 12.5% of all event revenue ex. VAT. The calculator counts it as a cost."]],
    ["What the margin means on a full event", ["With drinks, hall or hire on the quote, the calculator finds the food price that gives the target margin across the whole event, after landlord and overhead. Food is never priced below its own cost. “Event profit after landlord & overhead” is the real bottom line; “Menu price per guest” is the number to quote a party planner."]],
