<script>
/* PREVIEW BUILD - NOT the live file.
   Loads the production calculator from this same origin and applies the
   pending change set in memory, so the preview talks to the real Google
   Sheet: real history, templates, equipment and policies.
   Production catering_quote.html is never modified.
   Refuses to render unless the production file is byte-for-byte the one
   this patch was built against AND the patched result is byte-for-byte
   the build that was tested. */
var SRC_HASH = 3961280512, OUT_LINES = 925, OUT_HASH = 25621736;
function fnv(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i)&0xFF;h=(h*0x01000193)>>>0;}return h;}
function fail(m){document.body.innerHTML='<div class="err"><h1>Preview did not build</h1><p>'+m+'</p><p>The live calculator is unaffected. Send this message to Claude.</p></div>';}
function apply(src,t){
  var L=t.split("\n"), i=0, subs=[], ops=[], cur=null, m;
  while(i<L.length){
    m=/^\$\$ (\d+)$/.exec(L[i]);
    if(m){subs.push({n:+m[1],a:L[i+1],b:L[i+2]});i+=3;continue;}
    m=/^@@ (\d+) (\d+)$/.exec(L[i]);
    if(m){cur={at:+m[1],del:+m[2],add:[]};ops.push(cur);i++;continue;}
    if(cur){cur.add.push(L[i]);}
    i++;
  }
  for(var s=0;s<subs.length;s++){
    var parts=src.split(subs[s].a);
    if(parts.length-1!==subs[s].n) throw new Error("expected "+subs[s].n+" match(es) for a replacement, found "+(parts.length-1));
    src=parts.join(subs[s].b);
  }
  var lines=src.split("\n");
  ops.slice().sort(function(a,b){return b.at-a.at;}).forEach(function(o){
    lines.splice.apply(lines,[o.at,o.del].concat(o.add));
  });
  return lines;
}
fetch("../catering_quote.html",{cache:"no-store"}).then(function(r){
  if(!r.ok) throw new Error("production file returned HTTP "+r.status);
  return r.text();
}).then(function(src){
  if(fnv(src)!==SRC_HASH) return fail("Production has changed since this preview was built, so the patch was not applied.");
  var raw=document.getElementById("patch").textContent.replace(/^\n/,"").replace(/\n$/,"");
  var lines=apply(src,raw);
  var out=lines.join("\n");
  if(lines.length!==OUT_LINES||fnv(out)!==OUT_HASH) return fail("Patched result did not match the build that was tested.");
  document.open();document.write(out);document.close();
}).catch(function(e){fail(String((e&&e.message)||e));});
</script>
